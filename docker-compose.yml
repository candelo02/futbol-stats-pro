services:
  backend:
    build: .
    container_name: futbol-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # ✅ CORRECCIÓN ERROR 5: Cambiado 'localhost' por el nombre del servicio 'db_futbol'
      # dentro de la red interna de Docker Compose los contenedores se comunican por nombre de servicio
      - DATABASE_URL=postgresql://postgres:password123@db_futbol:5432/futbol_db
    depends_on:
      db_futbol:
        condition: service_healthy

  db_futbol:
    image: postgres:15-alpine
    container_name: futbol-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: futbol_db
    ports:
      - "5432:5432"
    # ✅ CORRECCIÓN ERROR 6: Ruta interna corregida de /data/db (MongoDB) a /var/lib/postgresql/data (Postgres)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d futbol_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
